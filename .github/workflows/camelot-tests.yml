name: Camelot tuning tests
on:
  push:
    paths:
      - 'assets/js/camelot/**'
      - 'tests/camelot-tuning.test.mjs'
      - '.github/workflows/camelot-tests.yml'
  pull_request:
    paths:
      - 'assets/js/camelot/**'
      - 'tests/camelot-tuning.test.mjs'
      - '.github/workflows/camelot-tests.yml'
jobs:
  tuning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/camelot/app.mjs
      - run: node --check assets/js/camelot/tuning.mjs
      - run: node --test tests/camelot-tuning.test.mjs
