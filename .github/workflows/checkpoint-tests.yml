name: Checkpoint tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/*checkpoint*.yml'
      - '.github/workflows/pages-with-rfl.yml'
  push:
    branches: [master]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/*checkpoint*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
