name: Pinned Marain tests
on:
  push:
    paths: ['tools/marain-dictionary', '.gitmodules', 'scripts/*prepare_site.py', '.github/workflows/marain-tests.yml']
  pull_request:
    paths: ['tools/marain-dictionary', '.gitmodules', 'scripts/*prepare_site.py', '.github/workflows/marain-tests.yml']
permissions:
  contents: read
jobs:
  marain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init tools/marain-dictionary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix tools/marain-dictionary
      - run: python3 -m unittest discover -s scripts -p 'test_prepare_site.py' -v
      - run: python3 scripts/prepare_site.py .site-source
