name: Restore website checkpoint
on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Exact release tag, pages-checkpoint-RUN-ATTEMPT
        required: true
        type: string
permissions: {}
# Serialize with normal production deployments.
concurrency:
  group: pages-with-rfl
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/master' && vars.RFL_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download and verify the exact checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: python3 .github/scripts/pages_checkpoint.py restore "$CHECKPOINT"
      - name: Upload the original Pages tar unchanged
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: checkpoint/artifact.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore the complete website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record restored checkpoint
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: echo "Restored $CHECKPOINT. Future master deployments can replace it." >> "$GITHUB_STEP_SUMMARY"
