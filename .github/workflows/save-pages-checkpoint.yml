name: Save website checkpoint
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Pages deployment run ID (number from its Actions URL)
        required: true
        type: string
permissions: {}
concurrency:
  group: save-pages-checkpoint-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  save:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master
          persist-credentials: false
      - name: Save the deployed package without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: python3 .github/scripts/pages_checkpoint.py save "$RUN_ID"
