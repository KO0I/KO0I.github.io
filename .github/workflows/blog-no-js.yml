name: Static blog checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-blog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # This job tests the blog, not the standalone tool applications.
          submodules: false
      - name: Test the HTML auditor
        run: python3 -m unittest discover -s .github/tests -p 'test_audit_*.py' -v
      - name: Build with the existing Pages toolchain
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Audit every generated core page
        run: python3 .github/tests/audit_static_blog.py _site
      - name: Install test-only browser dependencies
        run: |
          python3 -m venv /tmp/blog-tests
          /tmp/blog-tests/bin/pip install playwright==1.57.0
          /tmp/blog-tests/bin/python -m playwright install --with-deps chromium
      - name: Read and navigate without site JavaScript
        run: /tmp/blog-tests/bin/python .github/tests/browser_static_blog.py _site
      # Deliberately no deployment, artifact-receiver secrets, or release steps.
