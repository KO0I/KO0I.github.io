name: Sync Bluesky #rasdFastwalkerLeague posts

on:
  schedule:
    # Every 6 hours, offset from :00 to be kind to the API
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bsky-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Bluesky posts
        run: python3 tools/bsky_sync.py

      - name: Sync Bluesky video thumbnails
        run: python3 scripts/bluesky_thumbnails.py

      - name: Commit and push new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/ images/bsky/ assets/bluesky/ _data/bluesky.json
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Sync Bluesky #rasdFastwalkerLeague posts"
            git push
          fi
