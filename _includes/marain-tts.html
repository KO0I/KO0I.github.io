<!-- ============================================================
     Marain pronunciation buttons (drop-in include)
     Injects a speaker button after each romanised Marain output
     (#marainPhraseRoman on Phrases, #englishMarainRoman on
     Dictionary) and speaks its contents aloud with a Welsh voice:
     Web Speech API first, ResponsiveVoice "Welsh Female" as fallback.
     ============================================================ -->
<style>
.marain-speak-btn {
  margin-top: 8px;
  font-size: 15px;
  cursor: pointer;
  background: #2a2a30;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 6px 12px;
  transition: background .2s ease, transform .1s ease;
}
.marain-speak-btn:hover { background: #3d3d46; }
.marain-speak-btn:active { transform: scale(0.97); }
.marain-speak-btn.speaking { background: #1f7a4d; border-color: #2ea36a; }
</style>
<script>
(function () {
  "use strict";

  /* Optional: paste a ResponsiveVoice API key here to serve high-quality
     Welsh speech to visitors whose devices lack a Welsh voice.
     Free key at https://responsivevoice.org/  */
  var RESPONSIVEVOICE_KEY = "E6uGOXry";

  function ready(fn) {
    if (document.readyState !== "loading") { fn(); }
    else { document.addEventListener("DOMContentLoaded", fn); }
  }

  ready(function () {

    /* ResponsiveVoice fallback loader (only fetched when needed) */
    var rvRequested = false;
    function ensureResponsiveVoice() {
      if (RESPONSIVEVOICE_KEY === "" || typeof responsiveVoice !== "undefined") { return; }
      if (!rvRequested) {
        rvRequested = true;
        var s = document.createElement("script");
        s.src = "https://code.responsivevoice.org/responsivevoice.js?key=" + encodeURIComponent(RESPONSIVEVOICE_KEY);
        document.body.appendChild(s);
      }
    }

    /* Local Welsh voice lookup (voices load asynchronously) */
    var voices = [];
    function refreshVoices() {
      if (!("speechSynthesis" in window)) { return; }
      voices = speechSynthesis.getVoices() || [];
    }
    if ("speechSynthesis" in window) {
      refreshVoices();
      speechSynthesis.onvoiceschanged = refreshVoices;
    }
    function welshVoice() {
      for (var i = 0; i < voices.length; i++) {
        var lang = (voices[i].lang || "").replace("_", "-").toLowerCase();
        if (lang === "cy" || lang.indexOf("cy-") === 0) { return voices[i]; }
      }
      return null;
    }

    function markSpeaking(btn, on) {
      btn.classList.toggle("speaking", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    }

    function speakWithLocalVoice(btn, text) {
      var u = new SpeechSynthesisUtterance(text);
      var v = welshVoice();
      if (v) { u.voice = v; }
      u.lang = "cy-GB";
      u.rate = 0.9;
      u.onend = function () { markSpeaking(btn, false); };
      u.onerror = function () { markSpeaking(btn, false); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      markSpeaking(btn, true);
    }

    function speakWithResponsiveVoice(btn, text) {
      responsiveVoice.speak(text, "Welsh Female", {
        onend: function () { markSpeaking(btn, false); },
        onerror: function () { markSpeaking(btn, false); }
      });
      markSpeaking(btn, true);
    }

    /* The ResponsiveVoice script loads asynchronously; wait for it
       instead of falling back to the default voice on first click. */
    var RV_WAIT_MS = 100, RV_MAX_ATTEMPTS = 50; /* up to ~5 s */
    function speakWithResponsiveVoiceWhenReady(btn, text, attempt) {
      if (typeof responsiveVoice !== "undefined") { speakWithResponsiveVoice(btn, text); return; }
      if (attempt >= RV_MAX_ATTEMPTS) { speakWithLocalVoice(btn, text); return; }
      setTimeout(function () { speakWithResponsiveVoiceWhenReady(btn, text, attempt + 1); }, RV_WAIT_MS);
    }

    function stopAll(btn) {
      if ("speechSynthesis" in window) { speechSynthesis.cancel(); }
      if (typeof responsiveVoice !== "undefined") { responsiveVoice.cancel(); }
      document.querySelectorAll(".marain-speak-btn.speaking").forEach(function (b) {
        b.classList.remove("speaking");
        b.setAttribute("aria-pressed", "false");
      });
    }

    function attachSpeakButton(box) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "marain-speak-btn";
      btn.innerHTML = "<span aria-hidden=\"true\">&#x1F50A;</span> Speak";
      btn.setAttribute("aria-label", "Speak this Marain result aloud in Welsh");
      box.parentNode.insertBefore(btn, box.nextSibling);

      btn.addEventListener("click", function () {
        /* Click again to stop */
        if ("speechSynthesis" in window && speechSynthesis.speaking) {
          stopAll(btn);
          return;
        }
        var text = (box.textContent || "").replace(/\s+/g, " ").trim();
        if (!text) { return; }

        if ("speechSynthesis" in window && welshVoice()) {
          speakWithLocalVoice(btn, text);
        } else {
          ensureResponsiveVoice();
          if (typeof responsiveVoice !== "undefined") {
            speakWithResponsiveVoice(btn, text);
          } else if ("speechSynthesis" in window) {
            speakWithResponsiveVoiceWhenReady(btn, text, 0);
          } else {
            markSpeaking(btn, false);
            btn.title = "Speech is not supported in this browser";
          }
        }
      });
    }

    /* Buttons after each romanised Marain output on the page */
    ["marainPhraseRoman", "englishMarainRoman"].forEach(function (id) {
      var box = document.getElementById(id);
      if (box) { attachSpeakButton(box); }
    });
  });
})();
</script>
