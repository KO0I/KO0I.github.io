<!-- ============================================================
     Marain pronunciation button (drop-in include)
     Injects a speaker button after the romanised Marain result
     (#marainPhraseRoman) on the /marain/ page and speaks its
     contents aloud with a Welsh voice: Web Speech API first,
     ResponsiveVoice "Welsh Male" as fallback.
     ============================================================ -->
<style>
#marain-speak-btn {
  margin-top: 8px;
  font-size: 15px;
  cursor: pointer;
  background: #2a2a30;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 6px 12px;
  transition: background .2s ease, transform .1s ease;
}
#marain-speak-btn:hover { background: #3d3d46; }
#marain-speak-btn:active { transform: scale(0.97); }
#marain-speak-btn.speaking { background: #1f7a4d; border-color: #2ea36a; }
</style>
<script>
(function () {
  "use strict";

  /* Optional: paste a ResponsiveVoice API key here to serve high-quality
     Welsh speech to visitors whose devices lack a Welsh voice.
     Free key at https://responsivevoice.org/  */
  var RESPONSIVEVOICE_KEY = "E6uGOXry";

  function ready(fn) {
    if (document.readyState !== "loading") { fn(); }
    else { document.addEventListener("DOMContentLoaded", fn); }
  }

  ready(function () {
    var box = document.getElementById("marainPhraseRoman");
    if (!box) { return; }  /* only pages with the Marain result box */

    var btn = document.createElement("button");
    btn.type = "button";
    btn.id = "marain-speak-btn";
    btn.innerHTML = "<span aria-hidden=\"true\">&#x1F50A;</span> Speak";
    btn.setAttribute("aria-label", "Speak the Marain result aloud in Welsh");
    box.parentNode.insertBefore(btn, box.nextSibling);

    /* ResponsiveVoice fallback loader (only fetched when needed) */
    var rvRequested = false;
    function ensureResponsiveVoice() {
      if (RESPONSIVEVOICE_KEY === "" || typeof responsiveVoice !== "undefined") { return; }
      if (!rvRequested) {
        rvRequested = true;
        var s = document.createElement("script");
        s.src = "https://code.responsivevoice.org/responsivevoice.js?key=" + encodeURIComponent(RESPONSIVEVOICE_KEY);
        document.body.appendChild(s);
      }
    }

    /* Local Welsh voice lookup (voices load asynchronously) */
    var voices = [];
    function refreshVoices() {
      if (!("speechSynthesis" in window)) { return; }
      voices = speechSynthesis.getVoices() || [];
    }
    if ("speechSynthesis" in window) {
      refreshVoices();
      speechSynthesis.onvoiceschanged = refreshVoices;
    }
    function welshVoice() {
      for (var i = 0; i < voices.length; i++) {
        var lang = (voices[i].lang || "").replace("_", "-").toLowerCase();
        if (lang === "cy" || lang.indexOf("cy-") === 0) { return voices[i]; }
      }
      return null;
    }

    function markSpeaking(on) {
      btn.classList.toggle("speaking", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    }

    function speakWithLocalVoice(text) {
      var u = new SpeechSynthesisUtterance(text);
      var v = welshVoice();
      if (v) { u.voice = v; }
      u.lang = "cy-GB";
      u.rate = 0.9;
      u.onend = function () { markSpeaking(false); };
      u.onerror = function () { markSpeaking(false); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      markSpeaking(true);
    }

    function speakWithResponsiveVoice(text) {
      responsiveVoice.speak(text, "Welsh Male", {
        onend: function () { markSpeaking(false); },
        onerror: function () { markSpeaking(false); }
      });
      markSpeaking(true);
    }

    btn.addEventListener("click", function () {
      /* Click again to stop */
      if ("speechSynthesis" in window && speechSynthesis.speaking) {
        speechSynthesis.cancel();
        if (typeof responsiveVoice !== "undefined") { responsiveVoice.cancel(); }
        markSpeaking(false);
        return;
      }
      var text = (box.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) { return; }

      if ("speechSynthesis" in window && welshVoice()) {
        speakWithLocalVoice(text);
      } else {
        ensureResponsiveVoice();
        if (typeof responsiveVoice !== "undefined") {
          speakWithResponsiveVoice(text);
        } else if ("speechSynthesis" in window) {
          /* Last resort: default voice, still tagged as Welsh */
          speakWithLocalVoice(text);
        } else {
          markSpeaking(false);
          btn.title = "Speech is not supported in this browser";
        }
      }
    });
  });
})();
</script>
