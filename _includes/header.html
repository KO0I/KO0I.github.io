{% if page.id or page.url == '/tags/' %}
  {% assign class = '' %}
{% else %}
  {% assign class = 'header--top' %}
{% endif %}
<header class="header {{ class }}">
  <div class="container">
    <div class="row">
      <div class="header__inner col col-12">
        <div class="logo">
          <a class="logo__link" href="{{ '/' | relative_url }}">
            {% if site.data.settings.logo %}
              <img class="logo__image" src="{{ site.data.settings.logo | relative_url }}" alt="{{ site.data.settings.linktitle | escape }}">
            {% else %}
              {{ site.data.settings.title }}
            {% endif %}
          </a>
        </div>
        <nav class="navigation top-nav" aria-label="Main navigation">
          {% include navigation.html %}
        </nav>
        <details class="site-menu">
          <summary><i class="fa-solid fa-bars" aria-hidden="true"></i> Menu</summary>
          <nav class="mobile-nav" aria-label="Mobile navigation">
            {% include navigation.html %}
            <a class="nav__link" href="{{ '/archive/' | relative_url }}">Archive</a>
          </nav>
        </details>
        <div class="nav-buttons">
          <a class="search-button" href="{{ '/archive/' | relative_url }}" aria-label="Browse all posts">
            <i class="nav__icon fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Archive</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
