<polygon points="350,246 356,234 424,234 430,246 424,258 356,258" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="390" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="currentColor">B</text>
<polygon points="430,246 436,234 504,234 510,246 504,258 436,258" fill="none" stroke="currentColor" stroke-width="2"/>
